# Reverse proxy — opcjonalnie na hoście Oracle (port 80 → app:3000)
# Instalacja: sudo apt install nginx
# sudo cp deploy/nginx/dedeki.conf /etc/nginx/sites-available/dedeki
# sudo ln -s /etc/nginx/sites-available/dedeki /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream dedeki_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # zamień na twoja-domena.pl jeśli masz DNS

    client_max_body_size 50M;

    location / {
        proxy_pass http://dedeki_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io/ {
        proxy_pass http://dedeki_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
