# Produkcja: PostgreSQL + aplikacja Node (Oracle Free Tier, VPS, itp.)
# Uruchomienie: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: dedeki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dedeki}
      POSTGRES_USER: ${POSTGRES_USER:-dedeki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - dedeki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dedeki-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dedeki-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-dedeki}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dedeki}
    volumes:
      - dedeki_uploads:/app/public/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - dedeki-net

volumes:
  dedeki_postgres_data:
  dedeki_uploads:

networks:
  dedeki-net:
