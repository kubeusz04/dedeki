# Produkcja: Oracle Cloud / VPS z Docker Compose
# Uruchomienie: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: dedeki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dedeki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - dedeki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dedeki"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dedeki

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dedeki-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/dedeki
    volumes:
      - dedeki_uploads_public:/app/public/uploads
      - dedeki_uploads_private:/app/private_uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dedeki

  # Opcjonalny HTTPS — włącz profilem: docker compose -f docker-compose.prod.yml --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: dedeki-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Ustaw DOMAIN w .env dla HTTPS}
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dedeki

networks:
  dedeki:
    driver: bridge

volumes:
  dedeki_postgres_data:
  dedeki_uploads_public:
  dedeki_uploads_private:
  caddy_data:
  caddy_config:
